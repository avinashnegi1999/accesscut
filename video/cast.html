<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;width:1920px;height:1080px;background:#fff;font-family:Inter,sans-serif}</style></head>
<body><svg id="s" width="1920" height="1080"></svg>
<script>
// The cast: neutral, non-realistic tones; told apart by tone, hair and shirt.
const CAST=[
  {name:'Raj',   role:'Contractor · leaving today', skin:'#c9d6e3',hair:'#2c3e50',shirt:'#0066cc',style:'short'},
  {name:'Priya', role:'Finance',                    skin:'#dcd6f0',hair:'#3d3557',shirt:'#8e44ad',style:'long'},
  {name:'Ayesha',role:'Data team',                  skin:'#cfe8dc',hair:'#24453a',shirt:'#1a7f37',style:'bun'},
  {name:'Kabir', role:'Data team',                  skin:'#ecd9dc',hair:'#4a2a30',shirt:'#a8324a',style:'short'}];
function avatar(p,x,y,s){
  const hair=p.style==='long'
    ?`<path d="M${-30*s},${-6*s} Q${-34*s},${-40*s} 0,${-42*s} Q${34*s},${-40*s} ${30*s},${-6*s} L${33*s},${34*s} L${20*s},${34*s} L${20*s},${-8*s} L${-20*s},${-8*s} L${-20*s},${34*s} L${-33*s},${34*s} Z" fill="${p.hair}"/>`
    :p.style==='bun'
    ?`<circle cx="0" cy="${-44*s}" r="${11*s}" fill="${p.hair}"/><path d="M${-29*s},${-4*s} Q${-31*s},${-38*s} 0,${-38*s} Q${31*s},${-38*s} ${29*s},${-4*s} Q${18*s},${-22*s} 0,${-22*s} Q${-18*s},${-22*s} ${-29*s},${-4*s} Z" fill="${p.hair}"/>`
    :`<path d="M${-28*s},${-6*s} Q${-30*s},${-36*s} 0,${-37*s} Q${30*s},${-36*s} ${28*s},${-6*s} Q${14*s},${-20*s} 0,${-19*s} Q${-14*s},${-20*s} ${-28*s},${-6*s} Z" fill="${p.hair}"/>`;
  return `<g transform="translate(${x},${y})">
    <path d="M${-44*s},${78*s} Q${-44*s},${36*s} 0,${36*s} Q${44*s},${36*s} ${44*s},${78*s} Z" fill="${p.shirt}"/>
    <rect x="${-9*s}" y="${22*s}" width="${18*s}" height="${18*s}" rx="${5*s}" fill="${p.skin}"/>
    <circle cx="0" cy="0" r="${28*s}" fill="${p.skin}"/>${hair}</g>`;}
let h='<text x="960" y="130" text-anchor="middle" font-size="64" font-weight="600" fill="#1d1d1f">The cast</text>';
CAST.forEach((o,i)=>{const x=300+i*440;
  h+=avatar(o,x,470,2.6)+`<text x="${x}" y="740" text-anchor="middle" font-size="46" font-weight="700" fill="#1d1d1f">${o.name}</text>`+
     `<text x="${x}" y="795" text-anchor="middle" font-size="28" font-weight="600" fill="#6e6e73">${o.role}</text>`;});
document.getElementById('s').innerHTML=h;
</script></body></html>
